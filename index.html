<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomorinl</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0a12;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(120,80,255,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,80,255,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .bg-glow {
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(120,80,255,0.18) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 2.5rem 1.5rem 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar-wrap {
    position: relative;
    margin-bottom: 1.2rem;
  }

  .avatar-ring {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, #7b4fff, #ff4fd8, #4ff0ff);
    animation: spin-ring 4s linear infinite;
  }

  @keyframes spin-ring {
    from { filter: hue-rotate(0deg); }
    to { filter: hue-rotate(360deg); }
  }

  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #12101e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 900;
    color: #c8aaff;
    letter-spacing: 2px;
    border: 3px solid #12101e;
  }

  .status-dot {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #3dff8f;
    border: 2px solid #0a0a12;
    box-shadow: 0 0 8px #3dff8f;
  }

  .display-name {
    font-family: 'Orbitron', monospace;
    font-size: 1.7rem;
    font-weight: 900;
    color: #fff;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(160,100,255,0.6);
    margin-bottom: 0.3rem;
  }

  .tag-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(120,80,255,0.12);
    border: 1px solid rgba(120,80,255,0.2);
    font-size: 0.75rem;
    color: #9b72ff;
    letter-spacing: 0.5px;
    margin-bottom: 1.6rem;
    font-weight: 600;
  }

  .tag-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #9b72ff;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .links-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 20px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #e8e4ff;
    text-decoration: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .link-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: 14px;
  }

  .link-btn:hover {
    transform: translateY(-2px) scale(1.01);
    border-color: rgba(255,255,255,0.18);
    color: #fff;
  }

  .link-btn:hover::before { opacity: 1; }
  .link-btn:active { transform: translateY(0) scale(0.98); }

  .roblox::before { background: linear-gradient(90deg, rgba(255,79,79,0.12), transparent); }
  .roblox:hover { border-color: rgba(255,79,79,0.35); box-shadow: 0 4px 24px rgba(255,79,79,0.18); }

  .discord::before { background: linear-gradient(90deg, rgba(114,137,218,0.15), transparent); }
  .discord:hover { border-color: rgba(114,137,218,0.4); box-shadow: 0 4px 24px rgba(114,137,218,0.2); }

  .tiktok::before { background: linear-gradient(90deg, rgba(255,0,80,0.12), transparent); }
  .tiktok:hover { border-color: rgba(255,0,80,0.3); box-shadow: 0 4px 24px rgba(255,0,80,0.15); }

  .btn-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .roblox .btn-icon { background: rgba(255,79,79,0.15); }
  .discord .btn-icon { background: rgba(114,137,218,0.18); }
  .tiktok .btn-icon { background: rgba(255,0,80,0.13); }

  .btn-label { flex: 1; }

  .btn-arrow {
    font-size: 0.85rem;
    color: #5a5570;
    transition: transform 0.2s, color 0.2s;
  }

  .link-btn:hover .btn-arrow {
    transform: translateX(3px);
    color: #a090cc;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(120,80,255,0.4), transparent);
    margin: 1.5rem 0 0.5rem;
  }

  .footer {
    font-size: 0.75rem;
    color: #3a3555;
    letter-spacing: 1px;
    margin-top: 2rem;
    font-weight: 500;
    text-align: center;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="container">
  <div class="avatar-wrap">
    <div class="avatar-ring">
      <div class="avatar-inner">TM</div>
    </div>
    <div class="status-dot"></div>
  </div>

  <div class="display-name">Tomorinl</div>

  <div class="tag-badge">
    <div class="tag-dot"></div>
    ONLINE NOW
  </div>

  <div class="links-wrap">

    <!-- Roblox -->

      <div class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="3" fill="#ff4f4f"/>

        </svg>
      </div>

        </svg>

      <span class="btn-label">Discord</span>
      <span class="btn-arrow">→</span>

    <!-- TikTok — แก้ href="YOUR_TIKTOK_LINK" -->
    <a href="YOUR_TIKTOK_LINK" target="_blank" class="link-btn tiktok">
      <div class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ff0050">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V9.03a8.16 8.16 0 0 0 4.77 1.52V7.1a4.85 4.85 0 0 1-1-.41z"/>
        </svg>
      </div>
      <span class="btn-label">TikTok</span>
      <span class="btn-arrow">→</span>
    </a>

  </div>

  <div class="divider"></div>
  <div class="footer">© 2026 TOMORINL · ALL RIGHTS RESERVED</div>
</div>
</body>
</html>
