<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomorinl</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0a12;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(120,80,255,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,80,255,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  .bg-glow {
    position: fixed; top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(120,80,255,0.18) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    padding: 2.5rem 1.5rem 3rem;
    display: flex; flex-direction: column; align-items: center;
  }
  .avatar-wrap { position: relative; margin-bottom: 1.2rem; }
  .avatar-ring {
    width: 100px; height: 100px;
    border-radius: 50%; padding: 3px;
    background: linear-gradient(135deg, #7b4fff, #ff4fd8, #4ff0ff);
    animation: spin-ring 4s linear infinite;
  }
  @keyframes spin-ring {
    from { filter: hue-rotate(0deg); }
    to { filter: hue-rotate(360deg); }
  }
  .avatar-inner {
    width: 100%; height: 100%; border-radius: 50%;
    background: #12101e;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 2rem; font-weight: 900; color: #c8aaff;
    letter-spacing: 2px; border: 3px solid #12101e;
  }
  .status-dot {
    position: absolute; bottom: 6px; right: 6px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #3dff8f; border: 2px solid #0a0a12;
    box-shadow: 0 0 8px #3dff8f;
  }
  .display-name {
    font-family: 'Orbitron', monospace;
    font-size: 1.7rem; font-weight: 900; color: #fff;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(160,100,255,0.6);
    margin-bottom: 0.3rem;
  }
  .tag-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px;
    background: rgba(120,80,255,0.12);
    border: 1px solid rgba(120,80,255,0.2);
    font-size: 0.75rem; color: #9b72ff;
    letter-spacing: 0.5px; margin-bottom: 1.6rem; font-weight: 600;
  }
  .tag-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: #9b72ff;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
  }
  .links-wrap { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .link-btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 14px 20px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #e8e4ff; text-decoration: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.05rem; font-weight: 600; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s ease;
    position: relative; overflow: hidden;
  }
  .link-btn::before {
    content: ''; position: absolute; inset: 0;
    opacity: 0; transition: opacity 0.2s; border-radius: 14px;
  }
  .link-btn:hover { transform: translateY(-2px) scale(1.01); border-color: rgba(255,255,255,0.18); color: #fff; }
  .link-btn:hover::before { opacity: 1; }
  .link-btn:active { transform: translateY(0) scale(0.98); }

  .roblox::before { background: linear-gradient(90deg, rgba(255,79,79,0.12), transparent); }
  .roblox:hover { border-color: rgba(255,79,79,0.35); box-shadow: 0 4px 24px rgba(255,79,79,0.18); }

  .discord::before { background: linear-gradient(90deg, rgba(114,137,218,0.15), transparent); }
  .discord:hover { border-color: rgba(114,137,218,0.4); box-shadow: 0 4px 24px rgba(114,137,218,0.2); }

  .youtube::before { background: linear-gradient(90deg, rgba(255,0,0,0.12), transparent); }
  .youtube:hover { border-color: rgba(255,0,0,0.35); box-shadow: 0 4px 24px rgba(255,0,0,0.18); }

  .discord-id::before { background: linear-gradient(90deg, rgba(79,240,255,0.1), transparent); }
  .discord-id:hover { border-color: rgba(79,240,255,0.3); box-shadow: 0 4px 24px rgba(79,240,255,0.15); }

  .btn-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .roblox .btn-icon { background: rgba(255,79,79,0.15); }
  .discord .btn-icon { background: rgba(114,137,218,0.18); }
  .youtube .btn-icon { background: rgba(255,0,0,0.13); }
  .discord-id .btn-icon { background: rgba(79,240,255,0.12); }

  .btn-label { flex: 1; }
  .btn-sub {
    font-size: 0.75rem; color: #7a7095;
    display: block; font-weight: 400; letter-spacing: 0.5px;
  }
  .btn-arrow {
    font-size: 0.85rem; color: #5a5570;
    transition: transform 0.2s, color 0.2s;
  }
  .link-btn:hover .btn-arrow { transform: translateX(3px); color: #a090cc; }

  /* Copy toast */
  .toast {
    position: fixed; bottom: 2rem; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e1a30; border: 1px solid rgba(120,80,255,0.3);
    color: #c8aaff; padding: 10px 20px;
    border-radius: 30px; font-size: 0.9rem;
    opacity: 0; transition: all 0.3s ease;
    pointer-events: none; z-index: 100;
    font-family: 'Rajdhani', sans-serif; font-weight: 600;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .divider {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(120,80,255,0.4), transparent);
    margin: 1.5rem 0 0.5rem;
  }
  .footer {
    font-size: 0.75rem; color: #3a3555;
    letter-spacing: 1px; margin-top: 2rem; font-weight: 500; text-align: center;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="toast" id="toast">คัดลอกแล้ว!</div>

<div class="container">
  <div class="avatar-wrap">
    <div class="avatar-ring">
      <div class="avatar-inner">TM</div>
    </div>
    <div class="status-dot"></div>
  </div>

  <div class="display-name">Tomorinl</div>
  <div class="tag-badge">
    <div class="tag-dot"></div>
    ONLINE NOW
  </div>

  <div class="links-wrap">

    <!-- Roblox -->
    <a href="https://www.roblox.com/users/4269713791/profile" target="_blank" class="link-btn roblox">
      <div class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="3" fill="#ff4f4f"/>
          <path d="M8 16L7 8l9 2-1 8-7-2z" fill="white"/>
        </svg>
      </div>
      <span class="btn-label">Roblox Profile</span>
      <span class="btn-arrow">→</span>
    </a>

    <!-- Discord Server -->
    <a href="https://discord.com/invite/3cZQbvW6cF" target="_blank" class="link-btn discord">
      <div class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#7289da">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
        </svg>
      </div>
      <span class="btn-label">
        Discord Server
        <span class="btn-sub">คลิกเพื่อเข้า server</span>
      </span>
      <span class="btn-arrow">→</span>
    </a>

    <!-- Discord ID copy -->
    <div class="link-btn discord-id" onclick="copyDiscord()">
      <div class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ff0ff" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </div>
      <span class="btn-label">
        Discord: noah_z0
        <span class="btn-sub">กดเพื่อคัดลอก ID</span>
      </span>
      <span class="btn-arrow">⎘</span>
    </div>

    <!-- YouTube -->
    <a href="https://www.youtube.com/@Erika%E0%B9%80%E0%B8%AD%E0%B8%A3%E0%B8%B4%E0%B8%81%E0%B9%89%E0%B8%B2/videos" target="_blank" class="link-btn youtube">
      <div class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ff0000">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </div>
      <span class="btn-label">
        YouTube
        <span class="btn-sub">Erika เอริก้า</span>
      </span>
      <span class="btn-arrow">→</span>
    </a>

  </div>

  <div class="divider"></div>
  <div class="footer">© 2026 TOMORINL · ALL RIGHTS RESERVED</div>
</div>

<script>
function copyDiscord() {
  navigator.clipboard.writeText('1044203346711543819').then(function() {
    var toast = document.getElementById('toast');
    toast.textContent = 'คัดลอก Discord ID แล้ว!';
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2500);
  });
}
</script>
</body>
</html>
